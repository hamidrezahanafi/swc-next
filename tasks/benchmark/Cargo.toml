[package]
edition = "2024"
name    = "benchmark"
publish = false
version = "0.1.0"

[features]
codspeed = []
tracy    = ["dep:tracy-client"]

[dependencies]
tracy-client = { workspace = true, optional = true }

[dev-dependencies]
oxc                    = { workspace = true }
oxc_allocator          = { workspace = true }
swc_next_allocator     = { workspace = true }
swc_next_ecma_ast      = { workspace = true }
swc_next_ecma_codegen  = { workspace = true }
swc_next_ecma_parser   = { workspace = true, features = ["unstable"] }
swc_next_ecma_semantic = { workspace = true }
swc_next_ecma_transformer = { workspace = true }

# Local SWC checkout used by `generator_transform`. Keep these path dependencies
# local to the benchmark task so the comparison measures both working trees.
swc_old_common = { package = "swc_common", path = "/private/tmp/swc-generator-bench-base/crates/swc_common" }
swc_old_ecma_ast = { package = "swc_ecma_ast", path = "/private/tmp/swc-generator-bench-base/crates/swc_ecma_ast" }
swc_old_ecma_codegen = { package = "swc_ecma_codegen", path = "/private/tmp/swc-generator-bench-base/crates/swc_ecma_codegen" }
swc_old_ecma_compat_es2015 = { package = "swc_ecma_compat_es2015", path = "/private/tmp/swc-generator-bench-base/crates/swc_ecma_compat_es2015" }
swc_old_ecma_parser = { package = "swc_ecma_parser", path = "/private/tmp/swc-generator-bench-base/crates/swc_ecma_parser" }
swc_old_ecma_transforms_base = { package = "swc_ecma_transforms_base", path = "/private/tmp/swc-generator-bench-base/crates/swc_ecma_transforms_base" }

criterion  = { workspace = true }
gungraun   = { workspace = true }
mimalloc   = { workspace = true }
rustc-hash = { workspace = true }
swc_core   = { workspace = true, features = ["ecma_parser_unstable"] }

[[bench]]
harness = false
name    = "gungraun"

[[bench]]
harness = false
name    = "parser"

[[bench]]
harness = false
name    = "visit"

[[bench]]
harness = false
name    = "semantic"

[[bench]]
harness = false
name    = "generator_transform"
