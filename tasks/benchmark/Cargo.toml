[package]
edition = "2024"
name    = "benchmark"
publish = false
version = "0.1.0"

[features]
codspeed                  = []
hole-profile-0            = ["swc_next_ecma_ast/hole-profile-0"]
hole-profile-hot-2        = ["swc_next_ecma_ast/hole-profile-hot-2"]
hole-profile-expression-only = ["swc_next_ecma_ast/hole-profile-expression-only"]
hole-profile-statement-only  = ["swc_next_ecma_ast/hole-profile-statement-only"]
tracy                     = ["dep:tracy-client"]

[dependencies]
tracy-client = { workspace = true, optional = true }

[dev-dependencies]
oxc                    = { workspace = true }
oxc_allocator          = { workspace = true }
swc_next_allocator     = { workspace = true }
swc_next_ecma_ast      = { workspace = true }
swc_next_ecma_codegen  = { workspace = true }
swc_next_ecma_parser   = { workspace = true, features = ["unstable"] }
swc_next_ecma_semantic = { workspace = true }

criterion  = { workspace = true }
gungraun   = { workspace = true }
mimalloc   = { workspace = true }
rustc-hash = { workspace = true }

[[bench]]
harness = false
name    = "gungraun"

[[bench]]
harness = false
name    = "parser"

[[bench]]
harness = false
name    = "visit"

[[bench]]
harness = false
name    = "semantic"

[[bench]]
harness = false
name    = "insertion"
