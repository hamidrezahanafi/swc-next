name: Release Crates

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish crates
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout main commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1v1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0

      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces --locked

      - name: Verify synchronized release version
        run: node .agents/skills/prepare-release/scripts/release-version.mjs check

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@a1c979fa8eec9cf00f2c01904184fe133deb0ce9 # v1

      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo ws publish --force "swc*" --publish-as-is
