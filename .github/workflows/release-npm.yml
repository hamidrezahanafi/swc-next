name: Release NPM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            extra_args: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            extra_args: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            extra_args: --use-napi-cross
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extra_args: --use-napi-cross
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extra_args: ""
    steps:
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout main commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@dc354b3df5a8e4db0bff5361fa176da74fcf3151 # v1v1
        with:
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core binding
        run: pnpm --filter @swc-next/core build --release --target ${{ matrix.target }} ${{ matrix.extra_args }}

      - name: Build parser binding
        run: pnpm --filter @swc-next/parser build --release --target ${{ matrix.target }} ${{ matrix.extra_args }}

      - name: Upload native bindings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: bindings-${{ matrix.target }}
          path: |
            napi/core/src-js/*.node
            napi/parser/src-js/*.node

  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish npm packages
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout main commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify synchronized release version
        run: node .agents/skills/prepare-release/scripts/release-version.mjs check

      - name: Download native bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Assemble core platform packages
        run: |
          pnpm exec napi create-npm-dirs --package-json-path napi/core/package.json --npm-dir release-dir/core
          pnpm exec napi artifacts --package-json-path napi/core/package.json --output-dir artifacts --npm-dir release-dir/core
          pnpm exec napi pre-publish --package-json-path napi/core/package.json --npm-dir release-dir/core --tag-style npm --no-gh-release --skip-optional-publish

      - name: Assemble parser platform packages
        run: |
          pnpm exec napi create-npm-dirs --package-json-path napi/parser/package.json --npm-dir release-dir/parser
          pnpm exec napi artifacts --package-json-path napi/parser/package.json --output-dir artifacts --npm-dir release-dir/parser
          pnpm exec napi pre-publish --package-json-path napi/parser/package.json --npm-dir release-dir/parser --tag-style npm --no-gh-release --skip-optional-publish

      - name: Validate npm package contents
        run: node .github/scripts/check-npm-release.mjs release-dir/core release-dir/parser napi/core napi/parser

      - name: Publish npm packages
        run: bash .github/scripts/publish-npm-release.sh release-dir/core release-dir/parser napi/core napi/parser
